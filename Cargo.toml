[package]
name = "herdr-agentsview"
version = "0.1.0"
authors = ["Phillip Cloud"]
edition = "2021"
license = "Apache-2.0"

[[example]]
name = "fake_agentsview"
test = true

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
iana-time-zone = "0.1"
ratatui = { version = "0.30.2", default-features = false, features = [
  "crossterm",
] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls-native-roots",
] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
tokio = { version = "1.47", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
toml = "1.1"
unicode-segmentation = "1.13"
unicode-width = "0.2"
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
rcgen = "0.14"
rustls = "0.23"
tempfile = "3.20"
tokio = { version = "1.47", features = ["test-util"] }
tokio-rustls = "0.26"
