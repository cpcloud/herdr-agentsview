---
name: Secret Scan

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Harden runner
        # v2.20.1
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40
        with:
          egress-policy: audit

      - name: Check out complete history
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan changed commits
        # v3.95.9
        uses: step-security/trufflehog-action@72d1f67314fcd8ca707e19692ff0cb670d7d02c7
        with:
          extra_args: --results=verified,unknown
          version: 3.95.9
