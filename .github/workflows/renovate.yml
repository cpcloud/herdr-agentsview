---
name: Renovate

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Harden runner
        # v2.20.1
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40
        with:
          egress-policy: audit

      - name: Run Renovate
        # v46.2.2
        uses: renovatebot/github-action@e09d604f8f803bb527bd8321ed5be06c460b8682
        with:
          renovate-version: 44.23.3
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: cpcloud/herdr-agentsview
          RENOVATE_USE_CLOUD_METADATA_SERVICES: "false"
